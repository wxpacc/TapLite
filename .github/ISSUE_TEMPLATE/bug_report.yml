name: 缺陷报告
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按步骤说明如何复现。
      placeholder: |
        1. 打开 TapLite
        2. 设置 ...
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      placeholder: Windows 版本、Python 版本、TapLite 提交或版本
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 日志、截图或补充说明。
