name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个建议要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 TapLite 如何改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他方案？
  - type: checkboxes
    id: safety
    attributes:
      label: 安全边界确认
      options:
        - label: 该建议不涉及反作弊绕过、后台注入、隐藏进程或规避权限限制。
          required: true
